services:
  mariadb:
    container_name: web-mariadb-1
    hostname: mariadb
    image: mariadb:10.5
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: 1-WebCalculatorDb
      MARIADB_USER: webdb
      MARIADB_PASSWORD: password
    ports:
      - "0.0.0.0:5011:3306"

  web:
    container_name: web-app-calculator
    hostname: app
    build: .
    ports:
      - "0.0.0.0:5001:5001"